<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Class Attendance Admin</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header class="topbar">
  <div><p class="eyebrow">B.Sc. Chemistry · 5th Semester</p><h1>Class Overview</h1></div>
  <div class="top-actions"><div id="today" class="date-pill"></div><button id="logoutBtn" class="ghost">Logout</button></div>
</header>
<main class="container">
  <section class="panel">
    <div class="section-head">
      <div><p class="eyebrow dark">Admin</p><h2>13 Students</h2><p class="muted">Open any student to view or edit their full record.</p></div>
      <button id="refreshBtn" class="primary small">Refresh</button>
    </div>
    <div id="classCards" class="stats-grid"></div>
  </section>
  <section class="panel">
    <div class="table-wrap">
      <table id="classTable">
        <thead><tr><th>Roll No.</th><th>Attendance</th><th>Present</th><th>Absent</th><th>Marked classes</th><th>Last updated</th><th></th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>
<script type="module" src="js/admin.js"></script>
</body>
</html>
